<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Rakan Aditya Community</title>
  
  <meta name="title" content="My Profile - Rakan Aditya Community">
  <meta name="description" content="Profil Discord resmi terhubung dengan database Rakan Aditya Community.">
  <meta name="theme-color" content="#5865F2">

  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            colors: {
              discord: { bg: '#313338', card: '#2b2d31', inner: '#1e1f22', accent: '#5865f2' }
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=gg+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'gg Sans', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Audio Sound Effects -->
  <audio id="audio-chime" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
  <audio id="audio-pop" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3"></audio>

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="/" class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-600/30 hover:scale-105 transition">
          <svg class="w-6 h-6 fill-white" viewBox="0 0 127.14 96.36">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.69,1.76,1.37,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.87,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.92,96.1,53,91.08,65.69,84.69,65.69Z"/>
          </svg>
        </a>
        <div>
          <h1 class="font-bold text-lg text-white leading-none">Rakan Aditya Community</h1>
          <span class="text-xs text-slate-400">User Profile Hub</span>
        </div>
      </div>
      <a href="/" class="text-xs text-slate-400 hover:text-white transition">← Beranda</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-10 w-full flex-grow flex flex-col justify-center items-center">
    
    <div id="no-auth-warning" class="hidden text-center space-y-4 max-w-md">
      <div class="text-4xl">🔒</div>
      <h3 class="text-xl font-bold text-white">Anda Belum Login</h3>
      <p class="text-xs text-slate-400">Silakan login menggunakan akun Discord di halaman utama untuk mengakses profil Anda.</p>
      <a href="/" class="inline-block px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs rounded-xl transition">Kembali ke Beranda</a>
    </div>

    <!-- Tampilan Kartu Profil Discord User -->
    <div id="profile-card" class="hidden w-full max-w-sm">
      <div class="bg-[#232428] rounded-2xl overflow-hidden shadow-2xl border border-slate-800">
        
        <!-- Banner -->
        <div id="user-banner" class="h-28 bg-gradient-to-r from-indigo-600 to-purple-600 relative bg-cover bg-center">
          <button onclick="logoutSession()" class="absolute top-3 right-3 w-7 h-7 bg-rose-600/80 hover:bg-rose-600 text-white rounded-full flex items-center justify-center transition shadow-lg" title="Keluar / Logout">
            ✕
          </button>
        </div>

        <!-- Detail Profil & Avatar -->
        <div class="px-4 pt-0 pb-4 relative">
          <div class="flex justify-between items-end -mt-12 mb-3 px-2">
            
            <div class="relative w-20 h-20 flex items-center justify-center">
              <img id="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar Discord" class="w-20 h-20 rounded-full border-4 border-[#232428] bg-[#232428] object-cover shadow-lg relative z-0">
              <span id="user-status-dot" class="w-5 h-5 bg-slate-500 border-4 border-[#232428] rounded-full absolute bottom-0 right-0 z-20" title="Offline"></span>
            </div>

            <div id="badges-container" class="bg-[#111214] px-2.5 py-1.5 rounded-lg flex items-center space-x-2 border border-slate-800 flex-wrap gap-y-1">
            </div>

          </div>

          <div class="bg-[#111214] rounded-xl p-4 space-y-3">
            <div>
              <div class="flex items-center space-x-2 flex-wrap">
                <h3 id="user-global-name" class="text-lg font-bold text-white leading-tight">Nama Pengguna</h3>
                <span id="user-clan-tag" class="hidden px-1.5 py-0.5 bg-slate-800 border border-slate-700 text-slate-300 font-semibold text-[11px] rounded tracking-wide"></span>
              </div>
              <p id="user-username" class="text-xs text-slate-400 mt-0.5">@username</p>
            </div>

            <hr class="border-slate-800">

            <div class="flex justify-between items-center text-xs">
              <div>
                <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">ID Pengguna</h4>
                <p id="user-id" class="font-mono text-slate-400">000000000000000000</p>
              </div>
              <span class="px-2 py-0.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded text-[10px]">Saved in MongoDB</span>
            </div>
          </div>

        </div>

      </div>
    </div>

  </main>

  <footer class="border-t border-slate-800 py-6 bg-slate-900/40 text-center text-xs text-slate-500">
    <p>Rakan Aditya Community &bull; Hosted on Vercel</p>
  </footer>

  <script>
    const DISCORD_FLAGS = {
      STAFF: 1 << 0, PARTNER: 1 << 1, HYPESQUAD: 1 << 2, BUG_HUNTER_LEVEL_1: 1 << 3,
      HYPESQUAD_BRAVERY: 1 << 6, HYPESQUAD_BRILLIANCE: 1 << 7, HYPESQUAD_BALANCE: 1 << 8,
      PREMIUM_EARLY_SUPPORTER: 1 << 9, BUG_HUNTER_LEVEL_2: 1 << 14, VERIFIED_DEVELOPER: 1 << 17,
      ACTIVE_DEVELOPER: 1 << 22
    };

    function logoutSession() {
      localStorage.removeItem('discord_user');
      window.location.href = '/';
    }

    function renderBadges(user) {
      const container = document.getElementById('badges-container');
      container.innerHTML = '';
      const flags = user.public_flags || user.flags || 0;
      const badges = [];

      if (flags & DISCORD_FLAGS.ACTIVE_DEVELOPER) {
        badges.push({ 
          title: 'Active Developers', 
          imgUrl: 'https://cdn3.emoji.gg/emojis/6699-activedev-blue.png',
          linkUrl: 'https://emoji.gg/emoji/6699-activedev-blue'
        });
      }

      if (user.premium_type && user.premium_type > 0) {
        badges.push({ 
          title: 'Nitro Subscribers', 
          imgUrl: 'https://cdn3.emoji.gg/emojis/789630-nitro.png',
          linkUrl: 'https://emoji.gg/emojis/789630-nitro'
        });
      }

      if (flags & DISCORD_FLAGS.HYPESQUAD_BRAVERY) {
        badges.push({ 
          title: 'HYPESQUAD BRAVERY', 
          imgUrl: 'https://cdn3.emoji.gg/emojis/677453-houseofbravery.png',
          linkUrl: 'https://emoji.gg/emojis/677453-houseofbravery'
        });
      } else if (flags & DISCORD_FLAGS.HYPESQUAD_BRILLIANCE) {
        badges.push({ 
          title: 'HYPESQUAD BRILLIANCE', 
          imgUrl: 'https://cdn3.emoji.gg/emojis/271697-houseofbrilliance.png',
          linkUrl: 'https://emoji.gg/emojis/271697-houseofbrilliance'
        });
      } else if (flags & DISCORD_FLAGS.HYPESQUAD_BALANCE) {
        badges.push({ 
          title: 'HYPESQUAD BALANCE', 
          imgUrl: 'https://cdn3.emoji.gg/emojis/251341-discordhypesquadbalancebadge.png',
          linkUrl: 'https://emoji.gg/emojis/251341-discordhypesquadbalancebadge'
        });
      }

      if (flags & DISCORD_FLAGS.PREMIUM_EARLY_SUPPORTER) {
        badges.push({ 
          title: 'PREMIUM EARLY SUPPORTER', 
          imgUrl: 'https://cdn3.emoji.gg/emojis/544377-discordearlysupporterbadge.png',
          linkUrl: 'https://emoji.gg/emojis/544377-discordearlysupporterbadge'
        });
      }

      badges.push({ 
        title: 'Completed Quest', 
        imgUrl: 'https://cdn3.emoji.gg/emojis/215207-discordcompletedaquestbadge.png',
        linkUrl: 'https://emoji.gg/emoji/215207-discordcompletedaquestbadge'
      });

      badges.forEach(b => {
        const a = document.createElement('a');
        a.href = b.linkUrl || '#';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.title = b.title;
        a.className = 'hover:scale-110 transition-transform inline-block';

        const img = document.createElement('img');
        img.src = b.imgUrl;
        img.alt = b.title;
        img.className = 'w-5 h-5 object-contain';
        
        a.appendChild(img);
        container.appendChild(a);
      });
    }

    async function fetchRealtimeStatus(userId) {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
        const data = await res.json();
        if (data.success) {
          const status = data.data.discord_status;
          const statusDot = document.getElementById('user-status-dot');
          if (statusDot) {
            statusDot.className = 'w-5 h-5 border-4 border-[#232428] rounded-full absolute bottom-0 right-0 z-20 ';
            if (status === 'online') statusDot.className += 'bg-emerald-500';
            else if (status === 'idle') statusDot.className += 'bg-amber-500';
            else if (status === 'dnd') statusDot.className += 'bg-rose-500';
            else statusDot.className += 'bg-slate-500';
          }
        }
      } catch (err) {}
    }

    function renderProfile(user) {
      document.getElementById('profile-card').classList.remove('hidden');

      document.getElementById('user-global-name').innerText = user.global_name || user.username;
      document.getElementById('user-username').innerText = `@${user.username}`;
      document.getElementById('user-id').innerText = user.id;

      // Clan Tag
      const clanTagElem = document.getElementById('user-clan-tag');
      const clanTag = (user.clan && user.clan.tag) || (user.primary_guild && user.primary_guild.tag);
      if (clanTag) {
        clanTagElem.innerText = `[${clanTag}]`;
        clanTagElem.classList.remove('hidden');
      } else {
        clanTagElem.classList.add('hidden');
      }

      // Avatar
      let avatarUrl = "https://cdn.discordapp.com/embed/avatars/0.png";
      if (user.avatar) {
        const format = user.avatar.startsWith('a_') ? 'gif' : 'png';
        avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${format}?size=512`;
      }
      document.getElementById('user-avatar').src = avatarUrl;

      // Avatar Frame Decoration
      const avatarContainer = document.getElementById('user-avatar').parentElement;
      const existingFrame = document.getElementById('avatar-decoration-frame');
      if (existingFrame) existingFrame.remove();

      if (user.avatar_decoration_data && user.avatar_decoration_data.asset) {
        const frameImg = document.createElement('img');
        frameImg.id = 'avatar-decoration-frame';
        frameImg.src = `https://cdn.discordapp.com/avatar-decoration-presets/${user.avatar_decoration_data.asset}.png?size=240`;
        frameImg.className = 'absolute -top-[10%] -left-[10%] w-[120%] h-[120%] max-w-none pointer-events-none z-10 object-contain';
        avatarContainer.appendChild(frameImg);
      }

      // Banner
      if (user.banner) {
        const bannerFormat = user.banner.startsWith('a_') ? 'gif' : 'png';
        const bannerUrl = `https://cdn.discordapp.com/banners/${user.id}/${user.banner}.${bannerFormat}?size=600`;
        document.getElementById('user-banner').style.backgroundImage = `url('${bannerUrl}')`;
      }

      renderBadges(user);
      fetchRealtimeStatus(user.id);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('discord_user');
      if (savedUser) {
        try {
          const userData = JSON.parse(savedUser);
          renderProfile(userData);
        } catch(e) {
          document.getElementById('no-auth-warning').classList.remove('hidden');
        }
      } else {
        document.getElementById('no-auth-warning').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
